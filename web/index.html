<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D2E5B" />
    <meta name="description" content="Comptes rendus d'intervention OUIDROP, même sans réseau." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <script>try{var t=localStorage.getItem('ouidrop.theme.v1');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);var x=localStorage.getItem('ouidrop.text.v1');if(x==='large'||x==='xlarge')document.documentElement.setAttribute('data-text',x)}catch(e){}</script>
    <title>OUIDROP Interventions</title>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
